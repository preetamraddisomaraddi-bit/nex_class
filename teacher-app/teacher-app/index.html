<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexClass Teacher</title>
  <script>
      try {
        const theme = localStorage.getItem('nexclass_theme')
        document.documentElement.dataset.theme = ['white', 'light', 'dark'].includes(theme) ? theme : 'white'
      } catch {
        document.documentElement.dataset.theme = 'white'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
